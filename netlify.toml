[build]
  command = "npm run build"
  publish = "dist"

# One Market production — déploiement automatique depuis la branche main.
# Rebuild 2026-09-12 après configuration complète des variables Vite.
# React Router fonctionne côté client. Toutes les routes doivent revenir
# vers index.html lorsqu'elles sont ouvertes directement dans le navigateur.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
